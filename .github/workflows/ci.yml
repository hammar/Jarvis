name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-analyzers:
    name: build-and-analyzers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.401
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Release build, analyzers, and formatting
        run: sh tools/validate.sh build

  architecture:
    name: architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.401
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Enforce project and compiled dependency boundaries
        run: sh tools/validate.sh architecture

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.401
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Run unit tests and collect coverage
        run: sh tools/validate.sh unit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-coverage
          path: artifacts/coverage/unit/
          if-no-files-found: error
          retention-days: 3

  integration-tests:
    name: integration-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.401
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Run SQLite and Web integration tests and collect coverage
        run: sh tools/validate.sh integration
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: integration-coverage
          path: artifacts/coverage/integration/
          if-no-files-found: error
          retention-days: 3

  coverage:
    name: coverage
    needs: [unit-tests, integration-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.401
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unit-coverage
          path: artifacts/coverage/unit/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: integration-coverage
          path: artifacts/coverage/integration/
      - name: Enforce coverage, report, and discovery gates
        run: sh tools/validate.sh coverage artifacts/coverage/unit artifacts/coverage/integration

  sdk-contracts-platform:
    name: sdk-contracts-platform (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.401
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Run actual pinned SDK contracts and solution contract tests
        run: sh tools/validate.sh sdk-contracts
      - name: Verify Aspire Simulator process and external endpoint behavior
        if: runner.os == 'Linux'
        run: sh tools/validate.sh aspire-e2e
      - name: Verify loopback-only Linux runtime containment
        if: runner.os == 'Linux'
        run: |
          docker build -f tools/sdk-validation/Dockerfile -t jarvis-sdk-egress:t01 .
          docker run --rm --network none --cap-add SYS_PTRACE \
            --entrypoint /bin/bash jarvis-sdk-egress:t01 /validation/check-containment.sh
          docker run --rm --network none --hostname jarvis-sdk-fixture \
            --add-host jarvis-sdk-fixture:127.0.0.1 --cap-add SYS_PTRACE jarvis-sdk-egress:t01

  sdk-contracts:
    name: sdk-contracts
    needs: [sdk-contracts-platform]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all SDK platform checks to succeed
        env:
          PLATFORM_RESULT: ${{ needs.sdk-contracts-platform.result }}
        run: |
          if [ "$PLATFORM_RESULT" != "success" ]; then
            echo "::error::SDK platform checks did not all succeed: $PLATFORM_RESULT"
            exit 1
          fi

  aspire-e2e:
    name: aspire-e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.401
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Launch and exercise the isolated Aspire E2E profile
        run: sh tools/validate.sh aspire-e2e

  browser-e2e:
    name: browser-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.401
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Run Playwright browser smoke and failure-probe gates
        run: sh tools/validate.sh browser-e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-artifacts
          path: artifacts/playwright/
          if-no-files-found: ignore
          retention-days: 3

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.401
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Validate local Markdown links
        run: sh tools/validate.sh docs
      - name: Validate remote Markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --no-progress '**/*.md'
          fail: true
